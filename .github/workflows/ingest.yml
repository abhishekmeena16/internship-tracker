name: Ingest Internships

on:
  workflow_dispatch: # Manual trigger only (disabled automatic 30-min cron to prevent failure alert emails)
  # To re-enable scheduled ingestion once DATABASE_URL secret is added to GitHub repository secrets:
  # schedule:
  #   - cron: '0 */6 * * *' # e.g. every 6 hours

jobs:
  ingest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret is not configured in repository Settings > Secrets and variables > Actions. Skipping ingestion to prevent failure."
            exit 0
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:generate

      - name: Run ingestion pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run ingest
        timeout-minutes: 30

      - name: Report status
        if: failure()
        run: echo "Ingestion failed! Check logs above."

